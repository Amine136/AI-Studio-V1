name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "host=${{ secrets.PROD_VPS_IP }}" >> $GITHUB_OUTPUT
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "${{ secrets.PROD_SSH_KEY }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "port=22" >> $GITHUB_OUTPUT
          echo "user=ouni" >> $GITHUB_OUTPUT
          echo "path=/home/ouni/vibecraft" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
          echo "host=${{ secrets.STAGING_VPS_IP }}" >> $GITHUB_OUTPUT
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "${{ secrets.STAGING_SSH_KEY }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "port=22" >> $GITHUB_OUTPUT
          echo "user=ouni" >> $GITHUB_OUTPUT
          echo "path=/home/ouni/AI-Studio-V1-staging" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.host }}
        username: ${{ steps.vars.outputs.user }}
        key: ${{ steps.vars.outputs.key }}
        port: ${{ steps.vars.outputs.port }}
        script: |
          cd ${{ steps.vars.outputs.path }}
          
          # Record the previous state
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          
          # Pull the latest code
          git pull origin ${{ github.ref_name }}
          
          # Deploy Frontend
          cd frontend
          npm install
          
          echo "Starting production build..."
          if ! npm run build; then
            echo "❌ BUILD FAILED! The live site has not been restarted."
            echo "Rolling back source code to $PREVIOUS_COMMIT..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            echo "Rollback complete. Please fix the errors on GitHub."
            exit 1
          fi
          
          echo "✅ Build successful! Restarting server..."
          pm2 restart ai-studio-frontend
          
          # Deploy Backend
          cd ../backend
          pm2 restart ai-studio-backend
