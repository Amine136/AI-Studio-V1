name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

    - name: Deploy to Production
      if: github.ref == 'refs/heads/main'
      env:
        SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY }}
        HOST: ${{ secrets.PROD_VPS_IP }}
      run: |
        if [ -z "$SSH_KEY_B64" ]; then echo "::error::PROD_SSH_KEY is empty. Add the base64 of the key to GitHub Secrets."; exit 1; fi
        if [ -z "$HOST" ]; then echo "::error::PROD_VPS_IP is empty."; exit 1; fi
        echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        # Fail fast with a clear message if the secret was stored wrong:
        ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null || { echo "::error::Decoded key is not a valid private key. Re-create PROD_SSH_KEY as: base64 -w0 ~/.ssh/google_compute_engine"; exit 1; }
        echo "Connecting to Production Server ($HOST)..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa ouni@$HOST << 'REMOTE'
          set -e
          cd /home/ouni/vibecraft
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          git fetch origin main
          git reset --hard origin/main
          cd frontend
          npm install
          if ! npm run build; then
            echo "❌ BUILD FAILED! Rolling back..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            exit 1
          fi
          pm2 restart vibecraft-frontend || pm2 start npm --name "vibecraft-frontend" -- run start
          cd ../backend
          echo "Running database migrations..."
          .venv/bin/alembic upgrade head
          pm2 restart vibecraft-backend || true
        REMOTE

    - name: Deploy to Staging
      if: github.ref == 'refs/heads/staging'
      env:
        SSH_KEY_B64: ${{ secrets.STAGING_SSH_KEY }}
        HOST: ${{ secrets.STAGING_VPS_IP }}
      run: |
        if [ -z "$SSH_KEY_B64" ]; then echo "::error::STAGING_SSH_KEY is empty. Add the base64 of the key to GitHub Secrets."; exit 1; fi
        if [ -z "$HOST" ]; then echo "::error::STAGING_VPS_IP is empty."; exit 1; fi
        echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null || { echo "::error::Decoded key is not a valid private key. Re-create STAGING_SSH_KEY as: base64 -w0 ~/.ssh/staging_vps_key"; exit 1; }
        echo "Connecting to Staging Server ($HOST)..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa ouni@$HOST << 'REMOTE'
          set -e
          cd /home/ouni/AI-Studio-V1-staging
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          git fetch origin staging
          git reset --hard origin/staging
          cd frontend
          npm install
          if ! npm run build; then
            echo "❌ BUILD FAILED! Rolling back..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            exit 1
          fi
          pm2 restart ai-studio-frontend || pm2 start npm --name "ai-studio-frontend" -- run start
          cd ../backend
          echo "Running database migrations..."
          .venv/bin/alembic upgrade head
          pm2 restart ai-studio-backend || true
        REMOTE
