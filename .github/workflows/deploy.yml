name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

    - name: Deploy to Production
      if: github.ref == 'refs/heads/main'
      env:
        SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        HOST: ${{ secrets.PROD_VPS_IP }}
      run: |
        if [ -z "$SSH_KEY" ]; then echo "❌ FATAL: PROD_SSH_KEY is empty. Did you add it to GitHub Secrets?"; exit 1; fi
        if [ -z "$HOST" ]; then echo "❌ FATAL: PROD_VPS_IP is empty. Did you add it to GitHub Secrets?"; exit 1; fi
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Connecting to Production Server ($HOST)..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa ouni@$HOST << 'REMOTE'
          set -e
          cd /home/ouni/vibecraft
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          git pull origin main
          cd frontend
          npm install
          if ! npm run build; then
            echo "❌ BUILD FAILED! Rolling back..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            exit 1
          fi
          pm2 restart vibecraft-frontend || pm2 start npm --name "vibecraft-frontend" -- run start
          cd ../backend
          pm2 restart vibecraft-backend || true
        REMOTE

    - name: Deploy to Staging
      if: github.ref == 'refs/heads/staging'
      env:
        SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        HOST: ${{ secrets.STAGING_VPS_IP }}
      run: |
        if [ -z "$SSH_KEY" ]; then echo "❌ FATAL: STAGING_SSH_KEY is empty. Did you add it to GitHub Secrets?"; exit 1; fi
        if [ -z "$HOST" ]; then echo "❌ FATAL: STAGING_VPS_IP is empty. Did you add it to GitHub Secrets?"; exit 1; fi
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Connecting to Staging Server ($HOST)..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa ouni@$HOST << 'REMOTE'
          set -e
          cd /home/ouni/AI-Studio-V1-staging
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          git pull origin staging
          cd frontend
          npm install
          if ! npm run build; then
            echo "❌ BUILD FAILED! Rolling back..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            exit 1
          fi
          pm2 restart ai-studio-frontend || pm2 start npm --name "ai-studio-frontend" -- run start
          cd ../backend
          pm2 restart ai-studio-backend || true
        REMOTE
