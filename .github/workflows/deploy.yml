name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_VPS_IP }}
        username: ouni
        key: ${{ secrets.PROD_SSH_KEY }}
        port: 22
        script: |
          cd /home/ouni/vibecraft
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          git pull origin main
          cd frontend
          npm install
          if ! npm run build; then
            echo "❌ BUILD FAILED! Rolling back..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            exit 1
          fi
          pm2 restart vibecraft-frontend || pm2 start npm --name "vibecraft-frontend" -- run start
          cd ../backend
          pm2 restart vibecraft-backend || true

    - name: Deploy to Staging
      if: github.ref == 'refs/heads/staging'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_VPS_IP }}
        username: ouni
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: 22
        script: |
          cd /home/ouni/AI-Studio-V1-staging
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          git pull origin staging
          cd frontend
          npm install
          if ! npm run build; then
            echo "❌ BUILD FAILED! Rolling back..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            exit 1
          fi
          pm2 restart ai-studio-frontend || pm2 start npm --name "ai-studio-frontend" -- run start
          cd ../backend
          pm2 restart ai-studio-backend || true
