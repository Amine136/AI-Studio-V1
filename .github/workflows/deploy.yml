name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.ref == 'refs/heads/main' && secrets.PROD_VPS_IP || secrets.STAGING_VPS_IP }}
        username: ouni
        key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
        port: 22
        script: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            cd /home/ouni/vibecraft
          else
            cd /home/ouni/AI-Studio-V1-staging
          fi
          
          # Record the previous state
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit was: $PREVIOUS_COMMIT"
          
          # Pull the latest code
          git pull origin ${{ github.ref_name }}
          
          # Deploy Frontend
          cd frontend
          npm install
          
          echo "Starting production build..."
          if ! npm run build; then
            echo "❌ BUILD FAILED! The live site has not been restarted."
            echo "Rolling back source code to $PREVIOUS_COMMIT..."
            cd ..
            git reset --hard $PREVIOUS_COMMIT
            echo "Rollback complete. Please fix the errors on GitHub."
            exit 1
          fi
          
          echo "✅ Build successful! Restarting server..."
          pm2 restart ai-studio-frontend
          
          # Deploy Backend
          cd ../backend
          pm2 restart ai-studio-backend
